[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lime-rec"
version = "0.1.0"
description = "LIME-Rec: Lightweight Late-Fusion Audit for Sequential Recommendation"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
readme = "README.md"
dependencies = [
    "datasets>=4.5.0",
    "numpy>=1.23",
    "requests>=2.28",
    "scipy>=1.10",
    "sentence-transformers>=2.2",
    "torch>=2.0",
    "threadpoolctl>=3.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
include = ["lime_rec*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
